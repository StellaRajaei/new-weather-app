<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form>
          <input type="search" placeholder="Enter a city..." required />
          <input type="submit" value="Search" />
        </form>
      </header>
      <main>
        <div>
          <h1>Paris</h1>
          <p>
            Wednesday 12:35, scattered clouds
            <br />
            Humidity: 82%, Wind: 3.6 km/h
          </p>
        </div>
        <div>☁️ 12°C</div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/StellaRajaei" target="_blank"
          >Setareh Rajaei</a
        >
        and is open sourced on
        <a href="https://github.com/" target="_blank">GitHub</a> hosted by
        <a href="https://render.com" target="_blank">Render</a>
      </footer>
    </div>
  </body>
  <script src="app.js"></script>
</html>
